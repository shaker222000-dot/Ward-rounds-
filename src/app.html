<style>
/* Layout: single-column bedside tool — sticky ward header, severity-striped patient rows, detail views stacked below */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --sunken:#e9edf1; --fg:#17202b; --muted:#5b6774; --line:#d5dce3;
  --accent:#1f4e79; --accent-fg:#ffffff;
  --red:#c0262d; --red-bg:#fbe7e7; --orange:#d9670b; --orange-bg:#fdeedd;
  --yellow:#b48a00; --yellow-bg:#fbf3cf; --green:#2e7d4f; --green-bg:#e3f3e9; --none:#8592a0; --none-bg:#eef1f4;
  --font-body:"Atkinson Hyperlegible", "Segoe UI", Roboto, system-ui, sans-serif;
  --font-data:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10151b; --surface:#18202a; --sunken:#212b37; --fg:#e6ebf0; --muted:#9aa7b4; --line:#2c3846;
  --accent:#7fb2e5; --accent-fg:#0d1620;
  --red:#ff6b6b; --red-bg:#3a1c1f; --orange:#ffa14a; --orange-bg:#3a2715; --yellow:#e8c547; --yellow-bg:#352f15; --green:#5fcf8b; --green-bg:#16301f; --none:#7d8a98; --none-bg:#222b35;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10151b; --surface:#18202a; --sunken:#212b37; --fg:#e6ebf0; --muted:#9aa7b4; --line:#2c3846;
  --accent:#7fb2e5; --accent-fg:#0d1620;
  --red:#ff6b6b; --red-bg:#3a1c1f; --orange:#ffa14a; --orange-bg:#3a2715; --yellow:#e8c547; --yellow-bg:#352f15; --green:#5fcf8b; --green-bg:#16301f; --none:#7d8a98; --none-bg:#222b35;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{padding-block:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;min-width:0;flex:1}
.brand b{font-size:1.05rem;letter-spacing:.01em}
.brand span{font-size:.78rem;color:var(--muted)}
button,.btn{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:9px 14px;min-height:42px}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
button.ghost{background:transparent}
button.danger{color:var(--red);border-color:var(--red)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.counts{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:.85rem;font-weight:700;border:1px solid transparent}
.chip i{width:10px;height:10px;border-radius:50%;display:inline-block}
.lv-red{--c:var(--red);--cb:var(--red-bg)} .lv-orange{--c:var(--orange);--cb:var(--orange-bg)}
.lv-yellow{--c:var(--yellow);--cb:var(--yellow-bg)} .lv-green{--c:var(--green);--cb:var(--green-bg)} .lv-none,.lv-inc{--c:var(--none);--cb:var(--none-bg)}
.chip.lv{background:var(--cb);color:var(--c)} .chip.lv i{background:var(--c)}
.chip.filter{background:var(--surface);border-color:var(--line);color:var(--fg)}
.chip.filter[aria-pressed="true"]{background:var(--cb);border-color:var(--c);color:var(--c)}
.sample-note{font-size:.82rem;color:var(--muted);margin:4px 0 12px}
.search{width:100%;margin:6px 0 12px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:42px;width:100%}
textarea{min-height:70px;resize:vertical}
.list{display:flex;flex-direction:column;gap:10px}
.pt{display:grid;grid-template-columns:8px 1fr auto;gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;padding:0;width:100%}
.pt .stripe{background:var(--c)}
.pt .body{padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:4px}
.pt .row1{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.pt .bed{font-family:var(--font-data);font-weight:600;font-size:.9rem;background:var(--sunken);padding:1px 7px;border-radius:6px}
.pt .name{font-weight:700;font-size:1.05rem}
.pt .meta{font-size:.85rem;color:var(--muted)}
.pt .dx{font-size:.92rem}
.pt .side{padding:12px 14px;display:flex;flex-direction:column;align-items:flex-end;gap:4px;justify-content:center}
.score{font-family:var(--font-data);font-weight:600;font-size:1.4rem;color:var(--c);font-variant-numeric:tabular-nums;line-height:1}
.trend{font-size:.78rem;color:var(--muted);white-space:nowrap}
.trend.worse{color:var(--red);font-weight:700} .trend.better{color:var(--green);font-weight:700}
.flagline{font-size:.82rem;color:var(--red);font-weight:700}
.tag{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
h2{font-size:1.25rem;margin:18px 0 8px;text-wrap:balance}
h3{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.banner{border-radius:var(--r);padding:14px;background:var(--cb);border:2px solid var(--c);display:flex;flex-direction:column;gap:6px;margin-top:12px}
.banner .lvl{color:var(--c);font-weight:700;font-size:1.1rem;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.banner ul{margin:0;padding-left:18px}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 16px}
.kv div{min-width:0}
.kv dt{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kv dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px}
.vbox{background:var(--sunken);border-radius:8px;padding:8px 10px;border-left:4px solid var(--c, transparent)}
.vbox small{display:block;font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.vbox b{font-family:var(--font-data);font-size:1.1rem;font-variant-numeric:tabular-nums}
.vbox em{font-style:normal;font-size:.75rem;color:var(--muted);margin-left:4px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sunken)}
td:first-child,th:first-child{text-align:left}
td.mono{font-family:var(--font-data)}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.form .full{grid-column:1/-1}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
label.check{flex-direction:row;align-items:center;gap:8px;color:var(--fg);font-size:.95rem}
label.check input{width:22px;height:22px;min-height:0}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.preview{margin-top:12px}
.note{background:var(--sunken);border-radius:8px;padding:10px 12px;font-size:.92rem}
.note p{margin:3px 0} .note b{color:var(--muted);font-family:var(--font-data);margin-right:6px}
.notes{display:flex;flex-direction:column;gap:10px}
.muted{color:var(--muted)}
.fab{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.25);border-radius:999px;padding:12px 20px}
.confirm{margin-top:10px;padding:12px;border:2px solid var(--red);border-radius:var(--r);background:var(--red-bg)}
.disclaimer{font-size:.78rem;color:var(--muted);margin-top:28px;border-top:1px solid var(--line);padding-top:12px}
.spark{width:100%;height:60px;display:block}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:20;font-size:.9rem}
@media (prefers-reduced-motion:no-preference){.pt{transition:transform .08s}.pt:active{transform:scale(.99)}}
.abadge{display:flex;gap:6px;flex-wrap:wrap}
.abadge b{font-size:.75rem;padding:1px 8px;border-radius:999px}
.ah{background:var(--red-bg);color:var(--red)} .am{background:var(--orange-bg);color:var(--orange)}
.alerts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.al{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 10px;border-radius:8px;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--none)}
.al span{min-width:0;font-size:.92rem}
.al-high{border-left-color:var(--red);background:var(--red-bg)} .al-med{border-left-color:var(--orange)} .al-info{border-left-color:var(--accent)}
button.small{min-height:34px;padding:5px 10px;font-size:.85rem;white-space:nowrap}
.row-between{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.ck{font-size:.88rem;margin-top:4px}
.ck-high{color:var(--red);font-weight:700} .ck-low,.ck-noweight{color:var(--orange);font-weight:700} .ck-ok{color:var(--green)} .ck-unknown{color:var(--muted)}
.fl-critical{color:var(--red);font-weight:700} .fl-high,.fl-low,.fl-nomogram{color:var(--orange);font-weight:700}
.savewarn{margin-top:12px;padding:12px;border-radius:var(--r);background:var(--red-bg);color:var(--red);border:2px solid var(--red)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.tab{border-radius:999px;padding:7px 14px;min-height:38px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.big{font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
.warnpanel{border-color:var(--orange);background:var(--orange-bg)}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><b>Paediatrics Ward Rounds</b><span>GMC Amritsar · Guru Nanak Dev Hospital</span></div>
  <button class="ghost" data-action="calc" id="btn-calc">Calculators</button>
  <button class="ghost" data-action="home" id="btn-home">Ward</button>
</div></header>
<div class="wrap" id="savewarn" hidden><div class="savewarn" role="alert"><b>Not saving.</b> This browser is blocking storage, so anything entered will be lost when the page closes. Open the app in a normal (not private) browser window.</div></div>
<main class="wrap" id="app"></main>
<div class="toast" id="toast" hidden></div>
<script>
(function(){
"use strict";
const KEY="gmcasr-paeds-ward-v1";
const DAY=864e5;
const LV={red:{label:"Critical",rank:0},orange:{label:"Deteriorating",rank:1},yellow:{label:"Watch closely",rank:2},green:{label:"Stable",rank:3},inc:{label:"Incomplete vitals",rank:2.5},none:{label:"No vitals yet",rank:4}};
const UP=["green","yellow","orange","red"];
let S={patients:[]}; let view={name:"ward"}; let filter=null; let q="";

/* ---------- storage ---------- */
function save(){let ok=true;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){ok=false}const b=document.getElementById("savewarn");if(b)b.hidden=ok;return ok}
function load(){let t=null;try{t=localStorage.getItem(KEY)}catch(e){return false}
  if(!t)return false;try{S=JSON.parse(t);if(!S||!Array.isArray(S.patients))throw 0;return true}
  catch(e){try{localStorage.setItem(KEY+"-unreadable-"+Date.now(),t)}catch(_){}S={patients:[]};return false}}
function uid(){return Math.random().toString(36).slice(2,10)}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function num(v){if(v===""||v==null)return null;const n=Number(v);return isFinite(n)?n:null}

/* ---------- age ---------- */
function ageDays(dob){return Math.floor((Date.now()-new Date(dob).getTime())/DAY)}
function ageText(dob){const d=ageDays(dob);if(d<0)return"—";if(d<28)return d+" d";const m=Math.floor(d/30.44);if(m<24)return m+" mo";const y=Math.floor(d/365.25),rm=Math.floor((d-y*365.25)/30.44);return y<6&&rm?y+" y "+rm+" mo":y+" y"}
function band(dob){const d=ageDays(dob);if(d<28)return"neo";if(d<365)return"inf";if(d<5*365.25)return"tod";if(d<12*365.25)return"sch";return"ado"}
/* Age-specific normal ranges (editable; verify against departmental protocol) */
const RANGE={
 neo:{label:"Neonate (<28 d)",hr:[100,180],rr:[30,60]},
 inf:{label:"Infant (1–12 mo)",hr:[100,160],rr:[30,50]},
 tod:{label:"1–4 y",hr:[90,140],rr:[24,40]},
 sch:{label:"5–11 y",hr:[70,120],rr:[18,30]},
 ado:{label:"12 y +",hr:[60,100],rr:[12,20]}
};
function minSBP(dob){const b=band(dob);if(b==="neo")return 60; /* term neonate; preterm uses MAP < GA */if(b==="inf")return 70;const y=ageDays(dob)/365.25;return y<=10?Math.round(70+2*y):90}
function dev(v,r){if(v==null)return null;if(v>=r[0]&&v<=r[1])return 0;const d=v>r[1]?(v-r[1])/r[1]:(r[0]-v)/r[0];return d<=.15?1:d<=.3?2:3}

/* ---------- PEWS ---------- */
function assess(p,v){
  const b=band(p.dob),R=RANGE[b],parts=[],red=[],warn=[];
  if(!v)return{level:"none",score:null,parts,red,warn,missing:[]};
  const add=(name,val,pts,why)=>{if(pts!=null)parts.push({name,val,pts,why})};
  add("Heart rate",v.hr,dev(v.hr,R.hr),"normal "+R.hr.join("–"));
  add("Resp. rate",v.rr,dev(v.rr,R.rr),"normal "+R.rr.join("–"));
  if(v.spo2!=null)add("SpO₂",v.spo2+"%",v.spo2>=95?0:v.spo2>=92?1:v.spo2>=90?2:3,"");
  if(v.o2)add("On oxygen","yes",v.o2==="high"?2:1,v.o2==="high"?"high-flow / NIV":"low-flow");
  if(v.wob)add("Work of breathing",v.wob,{none:0,mild:1,moderate:2,severe:3}[v.wob],"");
  if(v.crt!=null)add("CRT",v.crt+" s",v.crt<=2?0:v.crt<=3?1:3,"");
  if(v.avpu)add("AVPU",v.avpu,{A:0,V:1,P:2,U:3}[v.avpu],"");
  if(v.temp!=null){let t=0;if(b==="neo"){t=v.temp<35?3:v.temp<36.5?2:v.temp>=38.5?2:v.temp>=37.5?1:0}else{t=v.temp<35?2:v.temp<36?1:v.temp>39.5?2:v.temp>38?1:0}add("Temp",v.temp+" °C",t,"")}
  const score=parts.reduce((a,x)=>a+x.pts,0);
  /* danger-sign overrides */
  if(v.spo2!=null&&v.spo2<90)red.push("SpO₂ below 90%");
  const preterm=b==="neo"&&Number(p.gaWeeks)&&Number(p.gaWeeks)<37;
  if(v.sbp!=null&&!preterm&&v.sbp<minSBP(p.dob))red.push("Hypotension: SBP "+v.sbp+" (min "+minSBP(p.dob)+" for age)");
  if(b==="neo"&&v.map!=null){const lim=Number(p.gaWeeks)?Math.min(Number(p.gaWeeks),40):40;if(v.map<lim)red.push("Hypotension: MAP "+v.map+" below "+lim+(Number(p.gaWeeks)?" (gestation in weeks)":""))}
  if(v.hr!=null&&(v.hr<60||(b==="neo"&&v.hr<80)))red.push("Bradycardia: HR "+v.hr+(v.hr<60?": start CPR if poor perfusion":""));
  if(v.hr!=null&&v.hr>((b==="neo"||b==="inf")?220:180))red.push("HR "+v.hr+": consider SVT / shock");
  if(v.rr!=null&&b!=="neo"&&v.rr<10&&!v.apnoea)red.push("Bradypnoea: RR "+v.rr);
  if(v.crt!=null&&v.crt>3)red.push("CRT over 3 s: assess for shock");
  if(v.seizure)red.push("Convulsion");
  if(v.apnoea)red.push("Apnoea");
  if(v.gcs!=null&&v.gcs<=8)red.push("GCS "+v.gcs+": protect airway");
  if(v.avpu==="P"||v.avpu==="U")red.push("Responds only to pain / unresponsive");
  const hypo=b==="neo"?45:54;
  if(v.sugar!=null&&v.sugar<hypo)red.push("Hypoglycaemia: "+v.sugar+" mg/dL");
  if(v.sugar!=null&&v.sugar>300)warn.push("Blood sugar "+v.sugar+" mg/dL: check ketones");
  if(v.uo!=null&&v.uo<(b==="neo"?1:0.5))warn.push("Urine output "+v.uo+" mL/kg/h: low");
  if(b==="neo"&&v.temp!=null&&v.temp<36.5)warn.push("Neonatal hypothermia risk");
  if(b==="neo"&&v.temp!=null&&v.temp>=37.5)warn.push("Fever in a neonate: consider sepsis screen");
  const missing=[];if(v.hr==null)missing.push("HR");if(v.rr==null)missing.push("RR");if(v.spo2==null)missing.push("SpO₂");if(!v.avpu&&v.gcs==null)missing.push("AVPU/GCS");if(v.crt==null)missing.push("CRT");
  let level=score>=7?"red":score>=5?"orange":score>=3?"yellow":"green";
  if(parts.some(x=>x.pts===3)&&UP.indexOf(level)<2)level="orange";
  if(warn.length&&level==="green")level="yellow";
  if(red.length)level="red";
  if(missing.length&&level==="green")level="inc";
  return{level,score,parts,red,warn,missing};
}
function latest(p,i){return p.vitals.length>i?p.vitals[p.vitals.length-1-i]:null}
function status(p){
  const a=assess(p,latest(p,0)),prev=latest(p,1);
  let trend=null;if(prev&&a.score!=null){const ps=assess(p,prev).score;trend=a.score>ps?"worse":a.score<ps?"better":"same"}
  let level=a.level,ovActive=false,ovCleared=false;
  if(p.override&&p.override.level){const lv=latest(p,0);
    if(lv&&new Date(lv.at)>new Date(p.override.at))ovCleared=true;          /* new vitals since the override */
    else if(a.red.length&&p.override.level!=="red")ovCleared=true;         /* never hide danger signs */
    else{level=p.override.level;ovActive=true}}
  return{...a,computed:a.level,level,trend,ovActive,ovCleared};
}

/* ---------- samples ---------- */
function seed(){
  const now=Date.now(),iso=t=>new Date(t).toISOString();
  const dob=d=>new Date(now-d*DAY).toISOString().slice(0,10);
  const P=(o)=>Object.assign({id:uid(),sample:true,status:"admitted",vitals:[],notes:[],override:null,unit:"Unit 1",consultant:"Dr. A (sample)",scheme:"",referredFrom:"",transport:""},o);
  S.patients=[
   P({name:"Baby of Harpreet",dob:dob(6),sex:"M",ipd:"S-1021",bed:"NICU 3",admittedAt:iso(now-2*DAY),diagnosis:"Late-onset neonatal sepsis",weight:2.4,gaWeeks:36,birthWeight:2.5,referredFrom:"CH Tarn Taran",transport:"108 ambulance",scheme:"JSSK",
     vitals:[{at:iso(now-10*36e5),hr:168,rr:58,spo2:94,o2:"low",wob:"mild",crt:2,avpu:"A",temp:37.6,sugar:62},{at:iso(now-1*36e5),hr:192,rr:72,spo2:89,o2:"low",wob:"moderate",crt:4,avpu:"V",temp:35.8,sugar:40,apnoea:true}]}),
   P({name:"Gurnoor",dob:dob(240),sex:"F",ipd:"S-1034",bed:"14A",admittedAt:iso(now-1*DAY),diagnosis:"Bronchiolitis",weight:7.1,referredFrom:"PHC Majitha",scheme:"Ayushman Bharat / MMSBY",
     vitals:[{at:iso(now-14*36e5),hr:150,rr:52,spo2:93,o2:"low",wob:"mild",crt:2,avpu:"A",temp:38.2},{at:iso(now-2*36e5),hr:172,rr:64,spo2:92,o2:"low",wob:"moderate",crt:2,avpu:"A",temp:38.4}]}),
   P({name:"Arjun",dob:dob(3*365+90),sex:"M",ipd:"S-1040",bed:"14B",admittedAt:iso(now-3*DAY),diagnosis:"Dengue with warning signs",weight:14,
     vitals:[{at:iso(now-20*36e5),hr:138,rr:30,spo2:98,crt:2,avpu:"A",temp:38.6,sbp:88},{at:iso(now-3*36e5),hr:142,rr:32,spo2:97,crt:2,avpu:"A",temp:37.4,sbp:86}]}),
   P({name:"Simran",dob:dob(7*365),sex:"F",ipd:"S-0988",bed:"9",admittedAt:iso(now-6*DAY),diagnosis:"Nephrotic syndrome, relapse",weight:22,

const $=s=>document.querySelector(s);
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
function dayOf(p){return Math.floor((Date.now()-new Date(p.admittedAt).getTime())/DAY)+1}
function when(iso){const d=new Date(iso);return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short"})+" "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",hour12:false})}
function since(iso){const h=(Date.now()-new Date(iso).getTime())/36e5;return h<1?Math.max(1,Math.round(h*60))+" min ago":h<48?Math.round(h)+" h ago":Math.round(h/24)+" d ago"}
function trendText(t){return t==="worse"?"▲ worse":t==="better"?"▼ better":t==="same"?"= same":""}
function render(){
  if(typeof P2VIEWS!=="undefined"&&P2VIEWS[view.name])return render2();
  const app=$("#app");
  if(view.name==="ward")app.innerHTML=wardView();
  else if(view.name==="patient")app.innerHTML=patientView(get(view.id));
  else if(view.name==="edit")app.innerHTML=editView(view.id?get(view.id):null);
  else if(view.name==="vitals")app.innerHTML=vitalsView(get(view.id));

function get(id){return S.patients.find(p=>p.id===id)}

function wardView(){
  const adm=S.patients.filter(p=>p.status==="admitted").map(p=>({p,s:status(p)}));
  adm.sort((a,b)=>LV[a.s.level].rank-LV[b.s.level].rank||(b.s.score||0)-(a.s.score||0));
  const counts={red:0,orange:0,yellow:0,inc:0,green:0,none:0};adm.forEach(x=>counts[x.s.level]++);
  const ql=q.trim().toLowerCase();
  const shown=adm.filter(x=>(!filter||x.s.level===filter)&&(!ql||[x.p.name,x.p.bed,x.p.ipd,x.p.diagnosis].join(" ").toLowerCase().includes(ql)));
  const anySample=S.patients.some(p=>p.sample);
  let h=`<div class="counts" role="group" aria-label="Filter by severity">`;
  ["red","orange","yellow","inc","green","none"].forEach(l=>{if((l==="none"||l==="inc")&&!counts[l])return;h+=`<button class="chip filter lv-${l}" data-action="filter" data-lv="${l}" aria-pressed="${filter===l}"><i style="background:var(--c)"></i>${LV[l].label} ${counts[l]}</button>`});

  h+=`<div class="list">`;

  shown.forEach(({p,s})=>{
    const lv=latest(p,0);
    h+=`<button class="pt lv-${s.level}" data-action="open" data-id="${p.id}">
      <span class="stripe"></span>
      <span class="body">
        <span class="row1"><span class="bed">${esc(p.bed||"—")}</span><span class="name">${esc(p.name)}</span>${p.sample?`<span class="tag">sample</span>`:""}</span>
        <span class="meta">${ageText(p.dob)} · ${esc(p.sex)} · ${p.weight?esc(p.weight)+" kg · ":""}Day ${dayOf(p)} · ${esc(p.ipd||"")}</span>
        <span class="dx">${esc(p.diagnosis||"Diagnosis not entered")}</span>
        ${s.red.length?`<span class="flagline">⚠ ${esc(s.red[0])}${s.red.length>1?` +${s.red.length-1} more`:""}</span>`:""}
        ${s.ovActive?`<span class="meta">Colour set manually: ${esc(p.override.reason)}</span>`:""}
        ${alertBadge(p)}
      </span>
      <span class="side"><span class="score">${s.score==null?"–":s.score}</span><span class="trend ${s.trend||""}">${trendText(s.trend)}</span><span class="trend">${lv?since(lv.at):"no vitals"}</span></span>
    </button>`});
  h+=`</div>`;
  const dc=S.patients.filter(p=>p.status==="discharged");
  if(dc.length){h+=`<h3>Discharged (${dc.length})</h3><div class="list">`+dc.map(p=>`<button class="pt lv-none" data-action="open" data-id="${p.id}"><span class="stripe"></span><span class="body"><span class="row1"><span class="name">${esc(p.name)}</span></span><span class="meta">${esc(p.diagnosis)}</span></span><span class="side"></span></button>`).join("")+`</div>`}
  h+=`<div class="actions">${anySample?`<button class="ghost" data-action="clear-samples">Remove sample patients</button>`:`<button class="ghost" data-action="load-samples">Load sample patients</button>`}</div>`;

  return h;
}
function disclaimer(){return`<p class="disclaimer">Decision support only. Scores and colours are for clinician review; the treating doctor decides. Normal ranges and PEWS thresholds are a starting set and must be checked against departmental protocol. Data is stored only on this device. Phase 1 prototype.</p>`}

function vbox(name,val,unit,pts){const c=pts==null?"":pts>=3?"var(--red)":pts===2?"var(--orange)":pts===1?"var(--yellow)":"var(--green)";return`<div class="vbox" style="--c:${c}"><small>${name}</small><b>${val==null||val===""?"–":esc(val)}</b><em>${unit||""}</em></div>`}
function patientView(p){
  if(!p){view={name:"ward"};return wardView()}
  const s=status(p),v=latest(p,0),R=RANGE[band(p.dob)];

  h+=`</div>`;
  h+=`<div class="actions"><button class="primary" data-action="vitals" data-id="${p.id}">Add vitals</button><button data-action="note" data-id="${p.id}">Progress note</button><button data-action="checks" data-id="${p.id}">Checklist</button><button data-action="meds" data-id="${p.id}">Medicines</button><button data-action="inv" data-id="${p.id}">Investigations</button><button data-action="lines" data-id="${p.id}">Lines</button><button data-action="calc" data-id="${p.id}">Calculators</button><button class="ghost" data-action="override" data-id="${p.id}">Set colour</button></div>`;
  h+=alertsPanel(p);

  if(v){h+=`<div class="vgrid">${vbox("HR",v.hr,"/min",pt("Heart rate"))}${vbox("RR",v.rr,"/min",pt("Resp. rate"))}${vbox("SpO₂",v.spo2,"%",pt("SpO₂"))}${vbox("Temp",v.temp,"°C",pt("Temp"))}${vbox("CRT",v.crt,"s",pt("CRT"))}${vbox("SBP",v.sbp,"mmHg",v.sbp!=null&&v.sbp<minSBP(p.dob)?3:null)}${vbox("AVPU",v.avpu,"",pt("AVPU"))}${vbox("GCS",v.gcs,"/15",v.gcs!=null&&v.gcs<=8?3:null)}${v.map!=null?vbox("MAP",v.map,"mmHg",null):""}${vbox("Sugar",v.sugar,"mg/dL",null)}${vbox("Urine",v.uo,"mL/kg/h",null)}${vbox("O₂",v.o2?(v.o2==="high"?"High-flow":"Low-flow"):"Air","",pt("On oxygen"))}${vbox("Breathing",v.wob||"–","",pt("Work of breathing"))}</div>`;
    h+=`<p class="muted" style="font-size:.82rem">Ranges used: ${R.label} · HR ${R.hr.join("–")} · RR ${R.rr.join("–")} · min SBP ${minSBP(p.dob)}</p>`;
    h+=`<h3>Score breakdown</h3><div class="tablewrap"><table><thead><tr><th>Parameter</th><th>Value</th><th>Points</th></tr></thead><tbody>${s.parts.map(x=>`<tr><td>${x.name}${x.why?` <span class="muted">(${x.why})</span>`:""}</td><td class="mono">${esc(x.val)}</td><td class="mono">${x.pts}</td></tr>`).join("")}<tr><td><b>Total</b></td><td></td><td class="mono"><b>${s.score}</b></td></tr></tbody></table></div>`;
  }else h+=`<div class="panel muted">No vitals recorded yet.</div>`;
  h+=medsSummary(p)+invSummary(p);
  if(p.vitals.length>1){h+=`<h3>Score trend</h3><div class="panel">${spark(p)}</div>`}
  if(p.vitals.length){h+=`<h3>Vitals log</h3><div class="tablewrap"><table><thead><tr><th>Time</th><th>PEWS</th><th>HR</th><th>RR</th><th>SpO₂</th><th>T</th><th>CRT</th><th>SBP</th><th>AVPU</th><th>Sugar</th></tr></thead><tbody>${p.vitals.slice().reverse().map(x=>{const a=assess(p,x);return`<tr class="lv-${a.level}"><td class="mono">${when(x.at)}</td><td class="mono" style="color:var(--c);font-weight:600">${a.score}</td><td class="mono">${x.hr??"–"}</td><td class="mono">${x.rr??"–"}</td><td class="mono">${x.spo2??"–"}</td><td class="mono">${x.temp??"–"}</td><td class="mono">${x.crt??"–"}</td><td class="mono">${x.sbp??"–"}</td><td class="mono">${x.avpu||"–"}</td><td class="mono">${x.sugar??"–"}</td></tr>`}).join("")}</tbody></table></div>`}
  h+=`<h3>Progress notes</h3>`;
  h+=p.notes.length?`<div class="notes">${p.notes.slice().reverse().map(n=>noteBlock(n)).join("")}</div>`:`<div class="panel muted">No notes yet.</div>`;
  h+=`<h3>Details</h3><div class="panel"><dl class="kv">
    ${kv("IPD / CR no.",p.ipd)}${kv("Date of birth",p.dob)}${kv("Weight",p.weight?p.weight+" kg":"")}${kv("Unit",p.unit)}${kv("Consultant",p.consultant)}${kv("Admitted",when(p.admittedAt))}

    ${band(p.dob)==="neo"||p.gaWeeks?kv("Gestation",p.gaWeeks?p.gaWeeks+" wk":"")+kv("Birth weight",p.birthWeight?p.birthWeight+" kg":""):""}

function kv(k,v){return v?`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`:""}
function noteBlock(n){return`<div class="note"><div class="muted" style="font-size:.8rem">${when(n.at)}</div>${n.s?`<p><b>S</b>${esc(n.s)}</p>`:""}${n.o?`<p><b>O</b>${esc(n.o)}</p>`:""}${n.a?`<p><b>A</b>${esc(n.a)}</p>`:""}${n.p?`<p><b>P</b>${esc(n.p)}</p>`:""}</div>`}
function spark(p){
  const pts=p.vitals.map(x=>assess(p,x).score),W=300,H=60,max=Math.max(8,...pts),n=pts.length;
  const X=i=>8+i*(W-16)/(n-1),Y=s=>H-6-s*(H-12)/max;
  const line=pts.map((s,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(s).toFixed(1)).join(" ");
  const ref=[3,5,7].map(t=>`<line x1="0" x2="${W}" y1="${Y(t)}" y2="${Y(t)}" stroke="var(--line)" stroke-dasharray="3 3"/><text x="${W-2}" y="${Y(t)-2}" font-size="9" text-anchor="end" fill="var(--muted)">${t}</text>`).join("");
  const last=pts[n-1],lc=assess(p,latest(p,0)).level;
  return`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="PEWS trend">${ref}<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2"/>${pts.map((s,i)=>`<circle cx="${X(i)}" cy="${Y(s)}" r="${i===n-1?4:2.5}" fill="${i===n-1?`var(--${lc==="inc"?"none":lc})`:"var(--accent)"}"/>`).join("")}</svg><div class="muted" style="font-size:.8rem">PEWS over the last ${n} entries · latest ${last} · dashed lines mark yellow 3, orange 5, red 7</div>`;
}

function field(id,label,val,type,extra){return`<label for="${id}">${label}<input id="${id}" name="${id}" type="${type||"text"}" value="${esc(val??"")}" ${extra||""}></label>`}

const VLIM={hr:["Heart rate",20,300],rr:["Resp. rate",0,150],spo2:["SpO₂",30,100],temp:["Temperature",28,44],crt:["CRT",0,10],sbp:["Systolic BP",20,250],map:["MAP",10,200],gcs:["GCS",3,15],sugar:["Blood sugar",5,1500],uo:["Urine output",0,20]};
function badVital(v){for(const k in VLIM){if(v[k]!=null&&(v[k]<VLIM[k][1]||v[k]>VLIM[k][2]))return`${VLIM[k][0]} ${v[k]} looks wrong (allowed ${VLIM[k][1]}–${VLIM[k][2]}). Check for a typo.`}return null}
function readVitals(){
  const g=id=>num($("#"+id).value),s=id=>$("#"+id).value||null;
  const v={at:new Date().toISOString(),hr:g("v-hr"),rr:g("v-rr"),spo2:g("v-spo2"),o2:s("v-o2"),wob:s("v-wob"),temp:g("v-temp"),crt:g("v-crt"),sbp:g("v-sbp"),map:g("v-map"),avpu:s("v-avpu"),gcs:g("v-gcs"),sugar:g("v-sugar"),uo:g("v-uo"),seizure:$("#v-seizure").checked,apnoea:$("#v-apnoea").checked};
  Object.keys(v).forEach(k=>{if(v[k]===null||v[k]===false)delete v[k]});return v;
}
function updatePreview(){

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-action]");if(!b)return;
  const a=b.dataset.action,id=b.dataset.id;
  if(a==="home"){view={name:"ward"};render()}
  else if(a==="open"){view={name:"patient",id};render()}
  else if(a==="new"){view={name:"edit"};render()}
  else if(a==="edit"){view={name:"edit",id};render()}
  else if(a==="vitals"){view={name:"vitals",id};render();updatePreview()}
  else if(a==="note"){view={name:"note",id};render()}
  else if(a==="override"){view={name:"override",id};render()}
  else if(a==="filter"){filter=filter===b.dataset.lv?null:b.dataset.lv;render()}
  else if(a==="clear-override"){get(id).override=null;save();view={name:"patient",id};render();toast("Using calculated colour")}
  else if(a==="discharge"){get(id).status="discharged";save();render();toast("Marked discharged")}
  else if(a==="readmit"){get(id).status="admitted";save();render();toast("Moved back to ward")}

  else if(a==="cancel-delete"){$("#confirm-slot").innerHTML=""}

});

document.addEventListener("submit",e=>{
  e.preventDefault();const f=e.target,id=f.dataset.id;
  if(f.id==="pform"){
    const g=x=>$("#"+x).value.trim();
    const d={name:g("f-name"),dob:g("f-dob"),sex:g("f-sex"),ipd:g("f-ipd"),bed:g("f-bed"),unit:g("f-unit"),consultant:g("f-consultant"),admittedAt:new Date(g("f-admitted")||Date.now()).toISOString(),weight:num(g("f-weight")),diagnosis:g("f-dx"),gaWeeks:num(g("f-ga")),birthWeight:num(g("f-bw")),referredFrom:g("f-ref"),transport:g("f-transport"),scheme:g("f-scheme")};
    if(!d.name||!d.dob){toast("Name and date of birth are required");return}
    if(new Date(d.dob)>new Date()){toast("Date of birth can't be in the future");return}
    if(new Date(d.admittedAt)>new Date(Date.now()+10*6e4)){toast("Admission time can't be in the future");return}
    if(new Date(d.admittedAt)<new Date(d.dob)){toast("Admission is before the date of birth");return}
    if(d.weight!=null&&(d.weight<=0||d.weight>150)){toast("Weight must be between 0 and 150 kg");return}
    if(d.gaWeeks!=null&&(d.gaWeeks<22||d.gaWeeks>44)){toast("Gestation must be 22–44 weeks");return}
    if(d.birthWeight!=null&&(d.birthWeight<0.3||d.birthWeight>6)){toast("Birth weight must be 0.3–6 kg");return}
    const wq=weightCheck({dob:d.dob},d.weight);if(wq&&f.dataset.wok!==String(d.weight)){f.dataset.wok=String(d.weight);toast(wq+" Tap again to confirm.");return}
    if(id){const P=get(id);if(d.weight&&d.weight!==P.weight)P.weights.push({at:new Date().toISOString(),kg:d.weight});Object.assign(P,d);save();view={name:"patient",id};toast("Details saved")}
    else{const p=Object.assign({id:uid(),status:"admitted",vitals:[],notes:[],override:null},d);normalize(p);if(d.weight)p.weights=[{at:new Date().toISOString(),kg:d.weight}];S.patients.push(p);save();view={name:"vitals",id:p.id};toast("Admitted. Enter first vitals")}

function neoRegimen(p,drug){const a=neoAges(p);if(!a||!NEO[drug])return null;const [dose,h]=NEO[drug](a);return{dose,h,a,text:`Neonatal: ${dose} mg/kg every ${h} h (GA ${a.ga} wk, PNA ${a.pna} d, PMA ${a.pma} wk)`}}

function fx(id){return FORM.find(f=>f.id===id)}
function r1(x){return Math.round(x*10)/10}
function r2(x){return x<10?Math.round(x*100)/100:r1(x)}
function drugSelect(id,val){const groups=[...new Set(FORM.map(f=>f.g))];return`<label for="${id}">Drug<select id="${id}" name="${id}">${groups.map(g=>`<optgroup label="${esc(g)}">${FORM.filter(f=>f.g===g).map(f=>`<option value="${f.id}"${f.id===val?" selected":""}>${esc(f.name)}</option>`).join("")}</optgroup>`).join("")}</select></label>`}

  const w=wt(p);if(!f.per||!w)return"";const lo=Math.min(f.per[0]*w,f.max||1e9),hi=Math.min(f.per[1]*w,f.max||1e9);
  return`Usual: ${r2(lo)}${hi!==lo?"–"+r2(hi):""} mg per dose${f.max?` (max ${f.max} mg)`:""} · ${f.freq}`;

/* adjust a drug's limits for this patient (route, age, weight) */
function rules(f,p,m){if(!f)return f;const w=wt(p);let g=f;
  if(f.id==="paracetamol"&&m&&m.route==="IV"&&w&&w<10)g={...f,per:[7.5,10],dayMax:30,freq:"6-hourly IV (< 10 kg: max 30 mg/kg/day)"};
  if(f.neoPer&&p.dob&&band(p.dob)==="neo")g={...f,per:f.neoPer};
  if(f.byWt&&w)g={...f,per:w<20?[3,3]:[2.4,2.4],note:"3 mg/kg if < 20 kg, 2.4 mg/kg if ≥ 20 kg"};

/* convert the entered dose to the drug's checking unit (mg, or IU for IU drugs); null = cannot convert */
function toBase(f,m){const u=m.unit||"mg",d=Number(m.dose),base=f.unit||"mg";
  if(u===base)return d;if(base==="mg"&&u==="mcg")return d/1000;

function checkDose(p,m){

  const d=toBase(f,m);
  if(d==null)return{st:"noweight",text:m.unit==="mL"?"Choose the formulation to check a dose entered in mL":`Can't check a dose in ${m.unit}; enter it in ${f.unit||"mg"}`};
  if(f.fixed){const e=f.fixed(p);if(!e)return{st:"low",text:"Not usually given at this age"};
    if(Math.abs(d-e.v)/e.v<=0.05)return{st:"ok",text:`Matches usual ${e.v.toLocaleString("en-IN")} ${e.u} for age/weight`};
    return{st:d>e.v?"high":"low",text:`${d>e.v?"Above":"Below"} usual ${e.v.toLocaleString("en-IN")} ${e.u} for age/weight`}}

  return{st:"ok",text:`${r1(pk)} mg/kg/dose · usual ${f.per[0]}${f.per[1]!==f.per[0]?"–"+f.per[1]:""} mg/kg ${f.freq}`};
}

function labRange(p,l){const b=band(p.dob);return l[b]?Object.assign({},l,l[b]):l}
function flagLab(p,inv){
  const l=LABS.find(x=>x.name===inv.test);if(!l||l.text||inv.value==null||inv.value==="")return null;

/* ---- fluids ---- */
function holliday(w){return w<=10?100*w:w<=20?1000+50*(w-10):1500+20*(w-20)}

/* ---- alert engine ---- */
function alerts(p){
  const A=[],add=(lv,t,act)=>A.push({lv,t,act});
  if(p.status!=="admitted")return A;
  const s=status(p),w=wt(p),neo=band(p.dob)==="neo",dx=(p.diagnosis||"").toLowerCase();
  /* meds */
  p.meds.filter(m=>m.active).forEach(m=>{
    const f=fx(m.drug),name=m.drug==="other"?m.name:f.name,c=checkDose(p,m);
    if(c.st==="high")add("high",`${name}: ${c.text}`,"meds");
    if(c.st==="low")add("med",`${name}: ${c.text}`,"meds");
    if(c.st==="noweight")add("med",`${name}: no weight recorded, dose not checked`,"meds");
    if(f&&f.nsaid&&/dengue/.test(dx))add("high",`${name} with dengue: NSAIDs usually avoided (bleeding risk)`,"meds");
    const ni=neoIntervalProblem(p,m);if(ni)add(/gentamicin|amikacin|vancomycin/.test(m.drug)&&24/(m.perDay||1)<NEO[m.drug](neoAges(p))[1]?"high":"med",`${name}: ${ni}`,"meds");
    if(neo&&NEO[m.drug]&&!neoAges(p))add("med",`${name}: enter gestation to check the neonatal dosing interval`,"meds");
    if((f&&f.abx)||m.abx){
      const d=Math.floor((Date.now()-new Date(m.start).getTime())/DAY)+1;
      const reviewed=m.reviewedAt&&hrsSince(m.reviewedAt)<24;
      if(d>=3&&d<=4&&!reviewed)add("med",`${name} day ${d}: 48–72 h review (cultures, de-escalate or stop?)`,"meds");
      if(d>=7&&!reviewed)add("med",`${name} day ${d}: confirm planned duration`,"meds");
      if(!m.stop)add("info",`${name}: no stop / review date set`,"meds");
      else if(String(m.stop).slice(0,10)<=today())add("high",`${name}: stop date reached (${m.stop})`,"meds");
    }
  });
  /* investigations */
  p.inv.forEach(i=>{
    if(i.status==="pending"){const h=hrsSince(i.orderedAt);if(h>=24)add(/culture/i.test(i.test)?"med":"info",`${i.test} pending ${Math.round(h)} h: chase result`,"inv")}
    else if(!i.ack){const fl=flagLab(p,i);add(fl==="critical"?"high":"med",`${fl==="critical"?"CRITICAL ":"New "}result not acknowledged: ${i.test} ${i.value??i.result??""} ${(LABS.find(l=>l.name===i.test)||{}).unit||""}${fl==="nomogram"?" (plot on the AAP 2022 hour-specific chart for age in hours)":""}`,"inv")}
  });
  const anyCulture=p.inv.some(i=>/culture/i.test(i.test));
  if(p.meds.some(m=>m.active&&((fx(m.drug)||{}).abx||m.abx))&&!anyCulture)add("med","On antibiotics but no culture ordered","inv");
  /* lines */
  p.lines.filter(l=>!l.removedAt).forEach(l=>{
    const h=hrsSince(l.insertedAt),d=Math.floor(h/24)+1;
    if(/cannula/i.test(l.type)&&h>=72)add("med",`Cannula (${l.site||"site?"}) in for ${Math.round(h)} h: resite or remove`,"lines");
    else if(/catheter|central/i.test(l.type))add(d>=7?"med":"info",`${l.type} day ${d}: is it still needed?`,"lines");
  });
  /* weight, fluids, sugar */
  const lw=p.weights[p.weights.length-1];
  if(!lw)add("high","No weight recorded: doses and fluids cannot be checked","checks");
  else if(dateOf(lw.at)!==today())add("info","No weight recorded today","checks");
  {const wq=weightCheck(p,w);if(wq)add("high",wq+" All doses and fluids use this weight.","checks")}
  if(p.fluidRate!=null&&w){const t=fluidTarget(p);if(t){const tr=t.day/24,ratio=p.fluidRate/tr;
    if(ratio>1.2)add("high",`Fluids ${p.fluidRate} mL/h is ${Math.round(ratio*100)}% of target ${r1(tr)} mL/h`,"calc");
    else if(ratio<0.8)add("med",`Fluids ${p.fluidRate} mL/h is only ${Math.round(ratio*100)}% of target ${r1(tr)} mL/h`,"calc")}}
  if(p.checks.ioDate!==today())add("info","Intake / output not charted today","checks");
  if(s.level==="red"||s.level==="orange"){const sg=p.vitals.slice().reverse().find(v=>v.sugar!=null);if(!sg||hrsSince(sg.at)>6)add("high","Sick child with no blood sugar in the last 6 h","vitals")}
  /* protocols & newborn care */
  const prot=p.checks.protocols;
  if(/sepsis/.test(dx)&&!prot.sepsis)add("high","Sepsis diagnosed: sepsis bundle not marked as started","checks");
  if(/dka|ketoacidosis/.test(dx)&&!prot.dka)add("high","DKA diagnosed: DKA protocol not marked as started","checks");
  if(/\bsam\b|severe acute malnutrition/.test(dx)&&!prot.sam)add("high","SAM diagnosed: WHO 10-step protocol not marked as started","checks");
  if(neo){const nb=p.checks.nb,miss=[["vitk","Vitamin K"],["bcg","BCG"],["opv","OPV-0"],["hepb","Hep B-0"]].filter(x=>!nb[x[0]]).map(x=>x[1]);if(miss.length)add("med","Newborn: "+miss.join(", ")+" not documented","checks")}
  if(!p.checks.nutrition)add("med","No feeding / nutrition plan documented","checks");
  if(!p.checks.consent)add("med","Consent not documented","checks");
  if(p.checks.referral&&!p.checks.referralDone)add("med","Referral pending: "+p.checks.referral,"checks");
  if(!p.checks.counselledAt||dateOf(p.checks.counselledAt)!==today())add("info","Parents not counselled today","checks");
  const order={high:0,med:1,info:2};A.sort((a,b)=>order[a.lv]-order[b.lv]);
  return A;
}
function alertBadge(p){const a=alerts(p),h=a.filter(x=>x.lv==="high").length,m=a.filter(x=>x.lv==="med").length;if(!h&&!m)return"";return`<span class="abadge">${h?`<b class="ah">${h} urgent</b>`:""}${m?`<b class="am">${m} to check</b>`:""}</span>`}

 {id:"midazolam",name:"Midazolam",u:"mcg/kg/min",r:[1,5],dose:2,mix:w=>[3*w,50],hint:"3 × wt mg in 50 mL → 1 mL/h = 1 mcg/kg/min"},

function infRate(f,dose,w,amt,vol){const c=amt/vol;if(!c||!w)return null;return f.u==="units/kg/h"?dose*w/c:dose*w*60/(c*1000)}
function resusRows(w,ageY){
  const R=[],mx=(v,m)=>m!=null&&v>m?m:v,f=v=>v<1?Math.round(v*100)/100:r1(v);
  const ad=mx(0.01*w,1);R.push(["Adrenaline (arrest) IV/IO",`${f(ad)} mg = ${f(ad*10)} mL of 1:10,000`,"0.01 mg/kg, max 1 mg"]);
  const am=mx(0.01*w,0.5);R.push(["Adrenaline IM (anaphylaxis)",`${f(am)} mg = ${f(am)} mL of 1:1000`,"0.01 mg/kg, max 0.5 mg"]);
  R.push(["Fluid bolus NS / RL",`${f(10*w)}–${f(20*w)} mL`,"10–20 mL/kg; 10 mL/kg in neonates, SAM, cardiac"]);
  R.push(["Dextrose 10%",`${f(2*w)} mL`,"2 mL/kg for hypoglycaemia"]);
  R.push(["Atropine",`${f(mx(0.02*w,0.5))} mg`,"0.02 mg/kg, max 0.5 mg"]);
  R.push(["Adenosine",`${f(mx(0.1*w,6))} mg, then ${f(mx(0.2*w,12))} mg`,"0.1 mg/kg (max 6), then 0.2 mg/kg (max 12)"]);
  R.push(["Amiodarone",`${f(mx(5*w,300))} mg`,"5 mg/kg, max 300 mg"]);
  R.push(["Calcium gluconate 10%",`${f(mx(0.5*w,20))} mL`,"0.5 mL/kg, max 20 mL, slow IV"]);
  R.push(["Sodium bicarbonate 8.4%",`${f(w)} mL`,"1 mEq/kg; dilute 1:1 in neonates"]);
  R.push(["Midazolam IN / buccal",`${f(mx(0.2*w,10))}–${f(mx(0.3*w,10))} mg`,"0.2–0.3 mg/kg, max 10 mg"]);
  R.push(["3% saline",`${f(3*w)}–${f(5*w)} mL`,"3–5 mL/kg for raised ICP"]);
  R.push(["Defibrillation",`${Math.round(2*w)} J first, then ${Math.round(4*w)} J`,"2 J/kg, then 4 J/kg (max 10 J/kg or adult dose)"]);
  R.push(["Synchronised cardioversion",`${f(0.5*w)}–${f(w)} J, then ${f(2*w)} J`,"0.5–1 J/kg, then 2 J/kg"]);
  if(ageY==null){R.push(["ETT size","Enter age","needed to choose the size formula"])}
  else if(ageY>=1){const u=ageY/4+4,c=ageY/4+3.5;R.push(["ETT size",`uncuffed ${r1(Math.round(u*2)/2)} / cuffed ${r1(Math.round(c*2)/2)} mm`,`depth ≈ ${r1(3*Math.round(u*2)/2)} cm at lip`])}
  else if(ageY>=28/365.25){const u=w<5?3.5:4,c=u-0.5;R.push(["ETT size (infant)",`uncuffed ${u} / cuffed ${c} mm`,`depth ≈ ${r1(3*u)} cm at lip`])}
  else{const e=w<1?2.5:w<2?3:w<3?3.5:3.5;R.push(["ETT size (neonate)",`${e} mm`,`depth ≈ ${r1(w+6)} cm at lip (weight + 6)`])}
  return R;
}
let calcState={tab:"fluids",inf:"adrenaline",w:null,age:null};
function calcView(p){
  const w=p?wt(p):calcState.w,ageY=p?ageDays(p.dob)/365.25:calcState.age,t=calcState.tab;
  let h=(p?back(p):`<div class="actions" style="margin-top:12px"><button class="ghost" data-action="home">← Ward list</button></div>`)+`<h2>Calculators${p?" · "+esc(p.name):""}</h2>`;
  if(p)h+=`<p class="muted">Using recorded weight ${w?w+" kg":"(none)"} · ${ageText(p.dob)}</p>`;
  else h+=`<div class="form">${field("k-w","Weight (kg)",calcState.w,"number","step=\"0.01\" min=\"0\" inputmode=\"decimal\"")}${field("k-age","Age (years, for ETT)",calcState.age,"number","step=\"0.1\" min=\"0\" inputmode=\"decimal\"")}</div>`;
  h+=`<div class="tabs" role="tablist">${[["fluids","Fluids"],["infusion","Infusions"],["resus","Resus doses"],["dose","Dose check"]].map(x=>`<button role="tab" class="tab" aria-selected="${t===x[0]}" data-action="calc-tab" data-tab="${x[0]}" data-id="${p?p.id:""}">${x[1]}</button>`).join("")}</div>`;
  if(!w)return h+`<div class="panel muted">Enter a weight to calculate.</div>`;
  if(t==="fluids"){
    const pct=p?p.fluidPct:(calcState.pct||100),neo=p?band(p.dob)==="neo":ageY!=null&&ageY<28/365;
    let day,how;if(p){const ft=fluidTarget(p);day=ft.day;how=ft.how}else{day=holliday(w)*pct/100;how="Holliday-Segar (100/50/20 mL/kg/day)"}
    h+=`<div class="panel"><div class="big mono">${Math.round(day)} mL/day · ${r1(day/24)} mL/h</div><div class="muted">${how}${pct!==100?` × ${pct}%`:""}</div>${neo?`<div class="muted">Neonatal schedule by day of life (term): D1 60–80, D2 80–100, D3 100–120, D4 120–140, D5+ 140–160 mL/kg/day.</div>`:""}</div>
    <form id="fform" class="form" data-id="${p?p.id:""}" style="margin-top:12px">
     ${sel("f-pct","Target (% of maintenance)",pct,[[100,"100% full maintenance"],[80,"80%"],[66,"66% (two-thirds)"],[50,"50%"]])}
     ${p?field("f-rate","Total running now (IV + feeds) mL/h",p.fluidRate,"number","step=\"0.1\" min=\"0\" inputmode=\"decimal\""):""}
     <div class="full actions"><button type="submit" class="primary">${p?"Save and check":"Update"}</button></div>
    </form>`;
    if(p&&p.fluidRate!=null){const ratio=p.fluidRate/(day/24);h+=`<div class="panel ${ratio>1.2||ratio<0.8?"warnpanel":""}" style="margin-top:10px">Running ${p.fluidRate} mL/h = <b>${Math.round(ratio*100)}%</b> of target.</div>`}
  }else if(t==="infusion"){
    const f=INF.find(x=>x.id===calcState.inf),[a0,v0]=f.mix(w),amt=calcState.amt??r1(a0),vol=calcState.vol??v0,dose=calcState.dose??f.dose,rate=infRate(f,dose,w,amt,vol);
    const out=dose<f.r[0]||dose>f.r[1];
    h+=`<form id="kinf" class="form" data-id="${p?p.id:""}">
     <div class="full">${sel("k-inf","Drug",f.id,INF.map(x=>[x.id,x.name]))}</div>
     ${field("k-dose","Dose ("+f.u+")",dose,"number","step=\"any\" min=\"0\" inputmode=\"decimal\"")}
     ${field("k-amt",f.u.startsWith("units")?"Amount in syringe (units)":"Amount in syringe (mg)",amt,"number","step=\"any\" min=\"0\" inputmode=\"decimal\"")}
     ${field("k-vol","Total volume (mL)",vol,"number","step=\"any\" min=\"0\" inputmode=\"decimal\"")}
    </form>
    <div class="panel" style="margin-top:12px"><div class="big mono">${rate==null?"–":r1(rate)+" mL/h"}</div><div class="muted">Standard mix for ${w} kg: ${esc(f.hint)}</div><div class="muted">Usual range ${f.r[0]}–${f.r[1]} ${f.u}</div>${out?`<div class="fl-critical"><b>Dose outside usual range</b></div>`:""}<div class="actions"><button class="small" data-action="inf-reset" data-id="${p?p.id:""}">Use standard mix</button></div></div>`;
  }else if(t==="resus"){
    h+=`<div class="tablewrap"><table><thead><tr><th>Drug / action</th><th>For ${w} kg</th><th>Rule</th></tr></thead><tbody>${resusRows(w,ageY).map(r=>`<tr><td style="white-space:normal">${r[0]}</td><td class="mono"><b>${r[1]}</b></td><td class="muted" style="text-align:left;white-space:normal">${r[2]}</td></tr>`).join("")}</tbody></table></div>`;
  }else{
    h+=`<form id="kdose" class="form"><div class="full">${drugSelect("kd-drug",calcState.kd||"paracetamol")}</div>${field("kd-dose","Dose (mg)",calcState.kdose||"","number","step=\"any\" min=\"0\" inputmode=\"decimal\"")}${sel("kd-freq","Frequency",calcState.kfreq||4,FREQ)}</form><div id="kdout" style="margin-top:12px"></div>`;
  }
  return h+`<p class="disclaimer">Calculators are aids only. Check every dose, dilution and rate independently before giving.</p>`;
}

const P2VIEWS={meds:medsView,inv:invView,lines:linesView,checks:checksView,calc:calcView};
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-action]");if(!b)return;const a=b.dataset.action,id=b.dataset.id||null,p=id?get(id):null;
  if(P2VIEWS[a]){view={name:a,id};if(a==="calc"){calcState.amt=calcState.vol=calcState.dose=null}render2()}
  else if(a==="calc-tab"){calcState.tab=b.dataset.tab;render2()}
  else if(a==="inf-reset"){calcState.amt=calcState.vol=calcState.dose=null;render2()}
  else if(a==="med-stop"){p.meds.find(m=>m.id===b.dataset.mid).active=false;save();render2();toast("Medicine stopped")}
  else if(a==="med-review"){p.meds.find(m=>m.id===b.dataset.mid).reviewedAt=new Date().toISOString();save();render2();toast("Marked reviewed")}
  else if(a==="inv-ack"){p.inv.find(i=>i.id===b.dataset.iid).ack=true;save();render2();toast("Marked seen")}
  else if(a==="line-remove"){p.lines.find(l=>l.id===b.dataset.lid).removedAt=new Date().toISOString();save();render2();toast("Marked removed")}
});

    const c=p.checks,w=num($("#c-wt").value);
    if(w!=null&&(w<=0||w>150)){toast("Weight must be between 0 and 150 kg");return}
    const wq=weightCheck(p,w);if(wq&&f.dataset.wok!==String(w)){f.dataset.wok=String(w);toast(wq+" Tap Save again to confirm.");return}
    if(w){p.weights.push({at:new Date().toISOString(),kg:w});p.weight=w}
    c.ioDate=$("#c-io").checked?today():(c.ioDate===today()?null:c.ioDate);
    if($("#c-counsel").checked){if(!c.counselledAt||dateOf(c.counselledAt)!==today())c.counselledAt=new Date().toISOString()}else if(c.counselledAt&&dateOf(c.counselledAt)===today())c.counselledAt=null;
    c.consent=$("#c-consent").checked;c.nutrition=$("#c-nutrition").value.trim();c.referral=$("#c-referral").value.trim();c.referralDone=$("#c-refdone").checked;
    c.protocols={sepsis:$("#c-sepsis").checked,dka:$("#c-dka").checked,sam:$("#c-sam").checked};
    if($("#c-vitk"))c.nb={vitk:$("#c-vitk").checked,bcg:$("#c-bcg").checked,opv:$("#c-opv").checked,hepb:$("#c-hepb").checked};
    save();view={name:"patient",id};render();toast("Checklist saved");
  }else if(f.id==="fform"){
    const pct=Number($("#f-pct").value);
    if(p){p.fluidPct=pct;const r=$("#f-rate").value;p.fluidRate=r===""?null:num(r);save()}else calcState.pct=pct;
    render2();toast("Fluids updated");
  }
});

/* ---- sample phase-2 data ---- */
function seedP2(){
  const now=Date.now(),iso=t=>new Date(t).toISOString(),ps=S.patients;
  ps.forEach(normalize);
  const [nb,br,dg,ns,dka]=ps;
  nb.meds=[{id:uid(),drug:"ampicillin",dose:120,unit:"mg",perDay:3,route:"IV",start:iso(now-2*DAY-3*36e5),stop:null,active:true},{id:uid(),drug:"gentamicin",dose:12,unit:"mg",perDay:1,route:"IV",start:iso(now-2*DAY-3*36e5),stop:null,active:true}];
  nb.lines=[{id:uid(),type:"Peripheral cannula",site:"R foot",insertedAt:iso(now-80*36e5)}];
  nb.inv=[{id:uid(),test:"Blood culture",orderedAt:iso(now-50*36e5),status:"pending"},{id:uid(),test:"CRP",orderedAt:iso(now-50*36e5),status:"resulted",value:46,resultAt:iso(now-40*36e5),ack:false}];
  nb.checks={nb:{vitk:true,opv:true},protocols:{},consent:true,nutrition:"EBM 25 mL 2-hourly via OG"};nb.fluidRate=14;
  br.meds=[{id:uid(),drug:"paracetamol",dose:105,unit:"mg",perDay:4,route:"Oral",start:iso(now-DAY),active:true}];
  br.checks={nb:{},protocols:{},consent:true,nutrition:"NG feeds 60 mL 3-hourly",ioDate:today()};br.fluidPct=66;br.fluidRate=30;
  br.lines=[{id:uid(),type:"Peripheral cannula",site:"L hand",insertedAt:iso(now-20*36e5)}];
  dg.meds=[{id:uid(),drug:"paracetamol",dose:300,unit:"mg",perDay:4,route:"Oral",start:iso(now-3*DAY),active:true},{id:uid(),drug:"ibuprofen",dose:140,unit:"mg",perDay:3,route:"Oral",start:iso(now-6*36e5),active:true}];
  dg.inv=[{id:uid(),test:"Platelets",orderedAt:iso(now-8*36e5),status:"resulted",value:18,resultAt:iso(now-5*36e5),ack:false},{id:uid(),test:"Haematocrit",orderedAt:iso(now-8*36e5),status:"resulted",value:46,resultAt:iso(now-5*36e5),ack:true},{id:uid(),test:"Dengue NS1 / IgM",orderedAt:iso(now-3*DAY),status:"resulted",result:"NS1 positive",resultAt:iso(now-2.5*DAY),ack:true}];
  dg.checks={nb:{},protocols:{},consent:true,nutrition:"Normal diet, oral fluids as tolerated",referral:"Haematology"};
  ns.meds=[{id:uid(),drug:"prednisolone",dose:44,unit:"mg",perDay:1,route:"Oral",start:iso(now-6*DAY),active:true}];
  ns.checks={nb:{},protocols:{},consent:true,nutrition:"Low-salt diet",ioDate:today(),counselledAt:iso(now)};ns.weights.push({at:iso(now-2*36e5),kg:22});
  dka.meds=[];dka.inv=[{id:uid(),test:"Potassium",orderedAt:iso(now-30*6e4),status:"pending"},{id:uid(),test:"Sodium",orderedAt:iso(now-60*6e4),status:"resulted",value:132,resultAt:iso(now-20*6e4),ack:false},{id:uid(),test:"Blood gas pH",orderedAt:iso(now-60*6e4),status:"resulted",value:7.08,resultAt:iso(now-20*6e4),ack:false}];
  dka.checks={nb:{},protocols:{},nutrition:"Nil by mouth"};dka.lines=[{id:uid(),type:"Peripheral cannula",site:"L ACF",insertedAt:iso(now-4*36e5)},{id:uid(),type:"Peripheral cannula",site:"R hand",insertedAt:iso(now-4*36e5)}];
}

if(!load())seed();
S.patients.forEach(normalize);
if(!S.p2){if(S.patients.some(p=>p.sample&&!p.meds.length&&!p.inv.length)){const keep=S.patients.filter(p=>!p.sample),samp=S.patients.filter(p=>p.sample);S.patients=samp;if(samp.length===5)seedP2();S.patients=samp.concat(keep)}S.p2=1;save()}
render();
try{if("serviceWorker" in navigator&&/^https?:/.test(location.protocol)&&document.querySelector('link[rel="manifest"]'))navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
})();
</script>
